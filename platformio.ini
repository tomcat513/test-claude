; WiFi Network Monitor - PlatformIO Configuration
; Target: ESP32 DevKitC (or compatible)

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partition scheme: minimal SPIFFS, more space for app
; Custom partition table to allocate space for LittleFS data
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Library dependencies
lib_deps =
    ESP Async WebServer @ ^1.2.3
    AsyncTCP @ ^1.1.1
    ArduinoJson @ ^7.0.0
    ESP32Ping @ ^1.7
    LittleFS_esp32 @ ^1.0.6

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DASYNCWEBSERVER_REGEX
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1

; Upload filesystem image
; Use: pio run --target uploadfs
